<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1493" />
      <stop offset="50%" stop-color="#FF69B4" />
      <stop offset="100%" stop-color="#FFB6C1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0818" />
      <stop offset="100%" stop-color="#14040B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect width="128" height="128" rx="36" fill="url(#bgGrad)" stroke="#FF69B4" stroke-width="4" />

  <!-- Impostor Mask Outer Shape -->
  <g filter="url(#glow)">
    <path d="M 28 44 C 28 32, 100 32, 100 44 C 100 78, 88 98, 64 98 C 40 98, 28 78, 28 44 Z" fill="url(#pinkGrad)" />
  </g>

  <!-- Mask Visor / Eyes -->
  <path d="M 40 48 C 40 42, 88 42, 88 48 C 88 62, 78 68, 64 68 C 50 68, 40 62, 40 48 Z" fill="#14040B" stroke="#FFE4E1" stroke-width="2" />
  
  <!-- Visor Cyan/White Glass Sheen Reflection -->
  <path d="M 44 48 C 46 44, 76 44, 80 46 C 74 54, 52 54, 44 48 Z" fill="#FFFFFF" opacity="0.6" />

  <!-- Sakura Petal on Forehead/Side -->
  <path d="M 94 26 C 88 22, 82 28, 86 34 C 92 40, 98 34, 98 28 C 98 24, 96 24, 94 26 Z" fill="#FF6EB4" />
  <circle cx="88" cy="30" r="1.5" fill="#FFFFFF" />

  <!-- Dramatic Question Mark / Sparkle -->
  <circle cx="64" cy="84" r="3" fill="#FFFFFF" />
  <circle cx="64" cy="76" r="2" fill="#FFE4E1" />
</svg>

